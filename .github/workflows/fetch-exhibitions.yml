name: 전시 데이터 수집

on:
  schedule:
    # 매일 한국시간 새벽 4시 17분 (UTC 19:17)
    - cron: "17 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 공공데이터 API에서 전시 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-exhibitions.mjs
      - name: 바뀐 데이터 저장
        run: |
          if git diff --quiet data/exhibitions.json; then
            echo "변경 없음"
          else
            git config user.name "exhibition-bot"
            git config user.email "exhibition-bot@users.noreply.github.com"
            git add data/exhibitions.json
            git commit -m "전시 데이터 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
