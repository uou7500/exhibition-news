name: 전시 데이터 수집

on:
  schedule:
    # 한국시간 오전 9시, 낮 12시, 오후 3시, 저녁 6시, 밤 12시 (각 7분쯤 시작, UTC 기준으로 적음)
    - cron: "7 0,3,6,9,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 공공데이터 API에서 전시 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-exhibitions.mjs
      - name: 대중픽 (네이버 블로그 최근 언급 수)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/fetch-popularity.mjs
      - name: 바뀐 데이터 저장
        run: |
          if git diff --quiet data/exhibitions.json data/popularity.json; then
            echo "변경 없음"
          else
            git config user.name "exhibition-bot"
            git config user.email "exhibition-bot@users.noreply.github.com"
            git add data/exhibitions.json data/popularity.json
            git commit -m "전시 데이터 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
